name: Build Nerd-Text Pages
on:
  schedule:
    - cron: "15 5 * * *" # Täglich 05:15 UTC (06:15 MEZ)
  workflow_dispatch:     # Manuell per Klick startbar

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Teletext JSON & TXT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 build_teletext.py
      - name: Commit updated pages
        run: |
          git config user.name "nerdtext-bot"
          git config user.email "bot@nerdtext.local"
          git add dist/*.json dist/*.txt
          git diff --staged --quiet || git commit -m "chore: daily teletext build"
          git push