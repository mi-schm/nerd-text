name: Build Nerd-Text Pages

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Teletext JSON & TXT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_teletext.py

      - name: Commit and push generated pages
        run: |
          git config user.name "nerdtext-bot"
          git config user.email "nerdtext-bot@users.noreply.github.com"
          git add dist/
          git diff --staged --quiet || (git commit -m "chore: daily teletext build" && git push)