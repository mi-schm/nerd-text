name: Build Nerd-Text Pages

on:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'build_teletext.py'
      - 'index.html'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate Teletext JSON & TXT
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_teletext.py

      - name: Commit & push updated dist/
        run: |
          git config user.name "nerdtext-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dist/
          if git diff --cached --quiet; then
            echo "No changes in dist/"
            exit 0
          fi
          LAST_MSG=$(git log -1 --pretty=%s)
          if [ "$LAST_MSG" = "chore: daily teletext build" ]; then
            git commit --amend -m "chore: daily teletext build"
            git push --force-with-lease
          else
            git commit -m "chore: daily teletext build"
            git push
          fi